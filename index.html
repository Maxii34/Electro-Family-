<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark-subtle">
        <div class="container">
          <a class="navbar-brand" href="/index.html">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="/index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>

              <!-- Ícono de carrito con modal -->
              <li class="nav-item">
                <a
                  href="#"
                  class="d-lg-none ms-1 me-4 position-relative"
                  data-bs-toggle="modal"
                  data-bs-target="#modalCarrito"
                >
                  <i class="bi bi-cart3"></i>
                  <span
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  >
                    3
                    <span class="visually-hidden">productos en el carrito</span>
                  </span>
                </a>
              </li>

              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Opciones
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="#">Acerca de nosotros</a>
                  </li>
                  <li><a class="dropdown-item" href="#">Contacto</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" href="#">Otra opción</a></li>
                </ul>
              </li>
            </ul>

            <form class="d-flex align-items-center" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Ingresá tu búsqueda"
                aria-label="Buscar"
              />
              <button class="btn btn-outline-success me-2" type="submit">
                <i class="bi bi-search"></i>
              </button>
              <button
                type="button"
                class="btn btn-dark mx-1"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                Login
              </button>
              <a href="/registro.html" class="btn btn-dark me-1">Register</a>

              <!-- Ícono del carrito con modal-->
              <a
                href="#"
                class="position-relative ms-3 border px-2 rounded"
                data-bs-toggle="modal"
                data-bs-target="#modalCarrito"
              >
                <i class="bi bi-cart3 fs-4 text-black"></i>
                <span
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                >
                  3
                  <span class="visually-hidden">productos en el carrito</span>
                </span>
              </a>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section>
        <!--Modal-carrito-->
        <div
          class="modal fade"
          id="modalCarrito"
          tabindex="-1"
          aria-labelledby="modalCarritoLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalCarritoLabel">
                  Tu carrito de compras
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                ></button>
              </div>

              <div class="modal-body">
                <ul class="list-group">
                  <li
                    class="list-group-item d-flex justify-content-between align-items-center"
                  >
                    Producto 1
                    <span class="badge bg-primary rounded-pill">$1000</span>
                  </li>
                  <li
                    class="list-group-item d-flex justify-content-between align-items-center"
                  >
                    Producto 2
                    <span class="badge bg-primary rounded-pill">$1500</span>
                  </li>
                  <li
                    class="list-group-item d-flex justify-content-between align-items-center"
                  >
                    Producto 3
                    <span class="badge bg-primary rounded-pill">$750</span>
                  </li>
                </ul>
              </div>

              <div class="modal-footer">
                <span class="fw-bold me-auto">Total: $3250</span>
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Seguir comprando
                </button>
                <button type="button" class="btn btn-success">
                  Finalizar compra
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- Modal -->
        <div
          class="modal fade"
          id="exampleModal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  Iniciar Sesion
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="mb-3">
                    <label for="email" class="form-label"
                      >Correo electrónico</label
                    >
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="tuemail@ejemplo.com"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="contraseña"
                      required
                    />
                  </div>

                  <button type="submit" class="btn btn-primary w-100 my-2">
                    Iniciar sesión
                  </button>
                  <button type="submit" class="btn btn-info w-100 my-2">
                    Iniciar con Google
                  </button>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cerrar
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
