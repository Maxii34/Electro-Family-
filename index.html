<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark-subtle px-3">
        <div class="container">
          <a class="navbar-brand" href="/index.html">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="/index.html"
                  >Inicio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Ofertas</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Opciones
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="#">Acerca de nosotros</a>
                  </li>
                  <li><a class="dropdown-item" href="#">Contacto</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" href="#">Otra opción</a></li>
                </ul>
              </li>
            </ul>
            <form class="d-flex align-items-center" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Ingresá tu búsqueda"
                aria-label="Buscar"
              />
              <button class="btn btn-outline-dark me-2" type="submit">
                <i class="bi bi-search"></i>
              </button>
              <button
                type="button"
                class="btn btn-dark mx-1"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                Login
              </button>
              <a href="/registro.html" class="btn btn-dark me-1">Register</a>
            </form>
          </div>

          <!-- ÍCONO DE CARRITO -->
          <div class="mx-2">
            <button
              type="button"
              class="btn btn-outline-secondary position-relative"
              data-bs-toggle="modal"
              data-bs-target="#modalCarrito"
            >
              <i class="bi bi-cart"></i>
              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger overflow-hidden"
              >
                3
              </span>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <section>
        <div
          class="modal fade"
          id="modalCarrito"
          tabindex="-1"
          aria-labelledby="modalCarritoLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalCarritoLabel">Tu carrito</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar"
                ></button>
              </div>
              <div class="modal-body">
                <!-- Producto 1 -->
                <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                  <img
                    src="https://via.placeholder.com/60"
                    alt="Producto 1"
                    class="me-3"
                  />
                  <div>
                    <h6 class="mb-1">Producto A</h6>
                    <p class="mb-1 text-muted">$1.000</p>
                    <button class="btn btn-sm btn-outline-danger">
                      Eliminar
                    </button>
                  </div>
                </div>
                <!-- Producto 2 -->
                <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                  <img
                    src="https://via.placeholder.com/60"
                    alt="Producto 2"
                    class="me-3"
                  />
                  <div>
                    <h6 class="mb-1">Producto B</h6>
                    <p class="mb-1 text-muted">$1.500</p>
                    <button class="btn btn-sm btn-outline-danger">
                      Eliminar
                    </button>
                  </div>
                </div>
                <!-- Producto 3 -->
                <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                  <img
                    src="https://via.placeholder.com/60"
                    alt="Producto 3"
                    class="me-3"
                  />
                  <div>
                    <h6 class="mb-1">Producto C</h6>
                    <p class="mb-1 text-muted">$2.000</p>
                    <button class="btn btn-sm btn-outline-danger">
                      Eliminar
                    </button>
                  </div>
                </div>
              </div>
              <div class="modal-footer justify-content-between">
                <span class="fw-bold">Total: $4.500</span>
                <button class="btn btn-success">Finalizar compra</button>
              </div>
            </div>
          </div>
        </div>
        <!-- Modal -->
        <div
          class="modal fade"
          id="exampleModal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  Iniciar Sesion
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <form>
                  <div class="mb-3">
                    <label for="email" class="form-label"
                      >Correo electrónico</label
                    >
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="tucorreo@ejemplo.com"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="contraseña"
                      required
                    />
                  </div>

                  <button type="submit" class="btn btn-primary w-100 my-2">
                    Iniciar sesión
                  </button>
                  <button type="submit" class="btn btn-info w-100 my-2">
                    Iniciar con Google
                  </button>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cerrar
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="row border text-body-secondary">
        <div class="col-12 col-md-4 col-lg-4 p-0 text-center">
          <div>
            <a href="#"><img src="" alt=""></a>
          </div>
        </div>
        <div class="col-12 col-md-4 col-lg-4 p-0 text-center">footer-div</div>
        <div class="col-12 col-md-4 col-lg-4 p-0 text-center">footer-div</div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
